<h1>FIRESET — настройки Free Fire для телефонов</h1>
<p>Стартовые настройки Free Fire для смартфонов Samsung, Xiaomi, Redmi, POCO, realme, HONOR, iPhone и других устройств.</p>

<script>
/*
 * =========================================================

 * =========================================================
 *
 * Это стартовые игровые пресеты.
 * Они НЕ являются официальными настройками производителей.
 */
const PROFILE_SETTINGS = {
    budget: {
        sensitivity: 175,
        redDot: 185,
        scope2x: 180,
        scope4x: 175,
        sniper: 80,
        fireButton: 48,
    },
    mid: {
        sensitivity: 182,
        redDot: 192,
        scope2x: 188,
        scope4x: 180,
        sniper: 86,
        fireButton: 49,
    },
    "upper-mid": {
        sensitivity: 188,
        redDot: 196,
        scope2x: 193,
        scope4x: 186,
        sniper: 92,
        fireButton: 50,
    },
    flagship: {
        sensitivity: 192,
        redDot: 198,
        scope2x: 196,
        scope4x: 190,
        sniper: 95,
        fireButton: 51,
    },
};
/*
 * =========================================================
 * НОРМАЛИЗАЦИЯ
 * =========================================================
 */
function normalize(value) {
    return value
        .toLowerCase()
        .replace(/ё/g, "е")
        .replace(/[-_]/g, " ")
        .replace(/[()]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}
function slug(value) {
    return normalize(value).replace(/\s+/g, "-");
}
/*
 * =========================================================
 * ОПРЕДЕЛЕНИЕ БРЕНДА
 * =========================================================
 */
function detectBrand(name) {
    const value = normalize(name);
    if (value.includes("iphone") ||
        value.includes("apple")) {
        return "Apple";
    }
    if (value.includes("samsung") ||
        value.includes("galaxy")) {
        return "Samsung";
    }
    if (value.includes("redmi") ||
        value.includes("xiaomi")) {
        return value.includes("xiaomi")
            ? "Xiaomi"
            : "Redmi";
    }
    if (value.includes("poco"))
        return "POCO";
    if (value.includes("realme"))
        return "realme";
    if (value.includes("infinix"))
        return "Infinix";
    if (value.includes("tecno"))
        return "Tecno";
    if (value.includes("oneplus"))
        return "OnePlus";
    if (value.includes("oppo"))
        return "OPPO";
    if (value.includes("honor"))
        return "HONOR";
    if (value.includes("pixel") || value.includes("google")) {
        return "Google";
    }
    if (value.includes("vivo"))
        return "vivo";
    if (value.includes("iqoo"))
        return "iQOO";
    if (value.includes("motorola") || value.includes("moto")) {
        return "Motorola";
    }
    if (value.includes("nothing"))
        return "Nothing";
    if (value.includes("asus") || value.includes("rog")) {
        return "ASUS";
    }
    if (value.includes("sony") || value.includes("xperia")) {
        return "Sony";
    }
    if (value.includes("huawei"))
        return "Huawei";
    if (value.includes("nokia"))
        return "Nokia";
    if (value.includes("zte") || value.includes("nubia")) {
        return "ZTE";
    }
    return "Unknown";
}
/*
 * =========================================================
 * ПРОФИЛЬ УСТРОЙСТВА
 * =========================================================
 */
function getProfile(name, profile) {
    if (profile) {
        return profile;
    }
    const value = normalize(name);
    // Apple
    if (value.includes("iphone")) {
        if (value.includes("pro") ||
            value.includes("air")) {
            return "flagship";
        }
        if (value.includes("17e") ||
            value.includes("16e") ||
            value.includes("se")) {
            return "upper-mid";
        }
        return "upper-mid";
    }
    // Samsung flagship
    if (value.includes("galaxy s") ||
        value.includes("galaxy z fold") ||
        value.includes("galaxy z flip")) {
        return "flagship";
    }
    // Samsung A
    if (value.includes("galaxy a5") ||
        value.includes("galaxy a7")) {
        return "upper-mid";
    }
    if (value.includes("galaxy a3") ||
        value.includes("galaxy a2")) {
        return "mid";
    }
    if (value.includes("galaxy a1") ||
        value.includes("galaxy m1") ||
        value.includes("galaxy m2")) {
        return "budget";
    }
    // POCO
    if (value.includes("poco f") ||
        value.includes("poco x") ||
        value.includes("poco x")) {
        return "upper-mid";
    }
    if (value.includes("poco c")) {
        return "budget";
    }
    // Xiaomi / Redmi
    if (value.includes("xiaomi 1") ||
        value.includes("xiaomi 2") ||
        value.includes("xiaomi 3") ||
        value.includes("xiaomi 4") ||
        value.includes("xiaomi 5")) {
        return "flagship";
    }
    if (value.includes("redmi note")) {
        return "mid";
    }
    if (value.includes("redmi k") ||
        value.includes("redmi turbo")) {
        return "upper-mid";
    }
    if (value.includes("redmi a")) {
        return "budget";
    }
    // OnePlus
    if (value.includes("oneplus") &&
        !value.includes("nord")) {
        return "flagship";
    }
    if (value.includes("oneplus nord")) {
        return "upper-mid";
    }
    // Google
    if (value.includes("pixel")) {
        if (value.includes("pro") ||
            value.includes("fold")) {
            return "flagship";
        }
        return "upper-mid";
    }
    // Gaming
    if (value.includes("rog phone") ||
        value.includes("redmagic") ||
        value.includes("nubia z")) {
        return "flagship";
    }
    // Honor
    if (value.includes("honor magic") ||
        value.includes("honor 5")) {
        return "flagship";
    }
    if (value.includes("honor 2") ||
        value.includes("honor 4") ||
        value.includes("honor 9") ||
        value.includes("honor x9")) {
        return "upper-mid";
    }
    // Vivo / iQOO
    if (value.includes("iqoo") ||
        value.includes("vivo x")) {
        return "flagship";
    }
    if (value.includes("vivo v")) {
        return "upper-mid";
    }
    // OPPO
    if (value.includes("find x") ||
        value.includes("find n")) {
        return "flagship";
    }
    if (value.includes("reno")) {
        return "upper-mid";
    }
    // realme
    if (value.includes("realme gt")) {
        return "flagship";
    }
    if (value.includes("realme number")) {
        return "upper-mid";
    }
    if (value.includes("realme c")) {
        return "budget";
    }
    // Motorola
    if (value.includes("edge 5") ||
        value.includes("edge 6") ||
        value.includes("razr")) {
        return "flagship";
    }
    if (value.includes("edge")) {
        return "upper-mid";
    }
    // Nothing
    if (value.includes("phone 3") || value.includes("phone 2")) {
        return "upper-mid";
    }
    return "mid";
}
/*
 * =========================================================
 * БРЕНДОВЫЕ КОРРЕКЦИИ
 * =========================================================
 */
function getBrandAdjustment(brand) {
    switch (brand) {
        case "Apple":
            return {
                redDot: -1,
                scope4x: -1,
                sniper: -1,
            };
        case "POCO":
            return {
                sensitivity: 1,
                redDot: 1,
                scope2x: 1,
                sniper: 1,
            };
        case "OnePlus":
            return {
                sensitivity: 1,
                redDot: 1,
                scope2x: 1,
                sniper: 1,
            };
        case "iQOO":
            return {
                sensitivity: 1,
                redDot: 1,
                scope2x: 1,
                sniper: 1,
            };
        case "Infinix":
        case "Tecno":
            return {
                sensitivity: -1,
                redDot: -1,
                scope2x: -1,
            };
        case "HONOR":
            return {
                scope2x: 1,
            };
        case "ASUS":
            return {
                sensitivity: 1,
                redDot: 1,
                scope2x: 1,
                sniper: 1,
            };
        case "ZTE":
            return {
                sensitivity: 1,
                redDot: 1,
            };
        default:
            return {};
    }

/*
 * =========================================================
 * ОГРАНИЧЕНИЯ

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, Math.round(value)));
}
/*
 * =========================================================
 * DPI — ЭКРАН, ANDROID И ТЕСТОВЫЙ ДИАПАЗОН
 * =========================================================
 * Для моделей с подтверждёнными характеристиками экрана:
 * PPI -> ближайшая Android logical density.
 * Диапазон вокруг неё — стартовая игровая зона для проверки drag.
 * Это не официальная настройка Garena и не гарантированный
 * "идеальный DPI" для каждого игрока.
 */
const ANDROID_DENSITIES = [
    240, 260, 280, 300, 320, 340, 360, 390,
    400, 420, 440, 450, 480, 520, 560, 600, 640,
];

const DPI_CLASS_PROFILES = {
    // Fallback only. These are not device-specific measurements.
    // They exist so unverified models never get presented as exact.
    budget: { base: 380, min: 360, max: 400 },
    mid: { base: 420, min: 400, max: 440 },
    "upper-mid": { base: 460, min: 440, max: 480 },
    flagship: { base: 500, min: 480, max: 520 },
};

const DPI_MODEL_OVERRIDES = {
    "redmi note 10": {
        ppi: 409,
        screen: "6.43″ • 2400×1080 • 409 PPI • 60 Hz",
        android: "Android 11",
    },
    "redmi note 10s": {
        ppi: 409,
        screen: "6.43″ • 2400×1080 • 409 PPI • 60 Hz",
        android: "Android 11",
    },
    "redmi note 10 pro": {
        ppi: 395,
        screen: "6.67″ • 2400×1080 • 395 PPI • 120 Hz",
        android: "Android 11",
    },
    "redmi note 10 pro max": {
        ppi: 395,
        screen: "6.67″ • 2400×1080 • 395 PPI • 120 Hz",
        android: "Android 11",
    },
    "redmi note 10 5g": {
        ppi: 405,
        screen: "6.5″ • 2400×1080 • 405 PPI • 90 Hz",
        android: "Android 11",
    },
    "redmi note 11s": {
        ppi: 409,
        screen: "6.43″ • 2400×1080 • 409 PPI • 90 Hz",
        android: "Android",
    },
};

function nearestAndroidDensity(ppi) {
    return ANDROID_DENSITIES.reduce((best, value) =>
        Math.abs(value - ppi) < Math.abs(best - ppi) ? value : best,
        ANDROID_DENSITIES[0]
    );
}

function getDpiInfo(name, profile) {
    const key = normalize(name);
    const exact = DPI_MODEL_OVERRIDES[key];

    if (exact) {
        const base = nearestAndroidDensity(exact.ppi);
        return {
            value: base,
            min: Math.max(300, base - 20),
            max: Math.min(640, base + 20),
            range: `${Math.max(300, base - 20)}–${Math.min(640, base + 20)}`,
            verified: true,
            source: "характеристики экрана подтверждены; DPI рассчитан по PPI как стартовая точка",
            screen: exact.screen,
            android: exact.android,
        };
    }

    const fallback = DPI_CLASS_PROFILES[profile] || DPI_CLASS_PROFILES.mid;
    return {
        value: fallback.base,
        min: fallback.min,
        max: fallback.max,
        range: `${fallback.min}–${fallback.max}`,
        verified: false,
        source: "расчётный ориентир; характеристики экрана ещё не подтверждены",
        screen: "точные характеристики экрана ещё не внесены в базу",
        android: "Android",
    };
}

/*
 * =========================================================
 * СОЗДАНИЕ ПРОФИЛЯ
 * =========================================================
 */
function createPhone(name, brand, profile) {
    const base = PROFILE_SETTINGS[profile];
    const adjustment = getBrandAdjustment(brand);
    return {
        id: slug(name),
        name,
        brand,
        sensitivity: clamp(base.sensitivity +
            (adjustment.sensitivity ?? 0), 170, 200),
        ...(() => {
            const dpiInfo = getDpiInfo(name, profile);
            return {
                dpi: dpiInfo.value,
                dpiMin: dpiInfo.min,
                dpiMax: dpiInfo.max,
                dpiRange: dpiInfo.range,
                dpiSource: dpiInfo.source,
                dpiVerified: dpiInfo.verified,
                dpiScreen: dpiInfo.screen,
                dpiAndroid: dpiInfo.android,
            };
        })(),
        redDot: clamp(base.redDot +
            (adjustment.redDot ?? 0), 185, 200),
        scope2x: clamp(base.scope2x +
            (adjustment.scope2x ?? 0), 185, 200),
        scope4x: clamp(base.scope4x +
            (adjustment.scope4x ?? 0), 180, 200),
        sniper: clamp(base.sniper +
            (adjustment.sniper ?? 0), 80, 100),
        fireButton: clamp(base.fireButton +
            (adjustment.fireButton ?? 0), 45, 55),
    };
}

function getEmptySettings(deviceName) {
    return {
        id: `unknown-${slug(deviceName) || "device"}`,
        name: deviceName.trim() ||
            "Неизвестное устройство",
        brand: detectBrand(deviceName),

/*
 * =========================================================
 * ПРОВЕРКА, ЧТО ВВОД ПОХОЖ НА МОДЕЛЬ
 * =========================================================
 *
 * Это предотвращает ситуацию:
 *
 * "abcxyz" -> настройки
 *
 * Теперь случайный текст получает нули.
 */
function looksLikeDeviceName(value) {
    const q = normalize(value);
    if (!q) {
        return false;
    }
    const words = q.split(" ");
    // Слишком длинный случайный набор
    if (q.length > 60) {
        return false;
    }
    // Явные бренды
    const brands = [
        "samsung",
        "galaxy",
        "iphone",
        "apple",
        "xiaomi",
        "redmi",
        "poco",
        "realme",
        "infinix",
        "tecno",
        "oneplus",
        "oppo",
        "honor",
        "pixel",
        "google",
        "vivo",
        "iqoo",
        "motorola",
        "moto",
        "nothing",
        "asus",
        "rog",
        "sony",
        "xperia",
        "huawei",
        "nokia",
        "zte",
        "nubia",
        "redmagic",
    ];
    if (brands.some((brand) => words.includes(brand))) {
        return true;
    }
    // iPhone
    if (/iphone\s*\d+/i.test(q)) {
        return true;
    }
    // Galaxy A/S/M/Z
    if (/^(galaxy|samsung)\s*[asmz]?\s*\d+/i.test(q) ||
        /^a\d+/i.test(q) ||
        /^s\d+/i.test(q)) {
        return true;
    }
    // Pixel
    if (/^pixel\s*\d+/i.test(q)) {
        return true;
    }
    // POCO
    if (/^poco\s+[a-z]?\d+/i.test(q)) {
        return true;
    }
    // Redmi Note
    if (/^redmi\s+note\s+\d+/i.test(q)) {
        return true;
    }
    // Xiaomi number
    if (/^xiaomi\s+\d+/i.test(q)) {
        return true;
    }
    // OnePlus
    if (/^oneplus\s+\d+/i.test(q)) {
        return true;
    }
    // Остальные модели, где есть цифра
    return (words.length >= 2 &&
        /\d/.test(q));
}
/*
 * =========================================================
 * ПОЛУЧИТЬ НАСТРОЙКИ
 * =========================================================
 */
function getPhoneSettings(deviceName) {
    const input = normalize(deviceName);
    if (!input) {
        return getEmptySettings("Неизвестное устройство");
    }
    /*
     * 1. Точное совпадение
     */
    if (database[input]) {
        return database[input];
    }
    /*
     * 2. Проверяем короткие/неполные названия.
     *
     * Например:
     * Samsung Galaxy A55
     * Galaxy A55
     * A55
     */
    const matchingEntries = Object.entries(database).filter(([key]) => {
        return (key === input ||
            key.includes(input) ||
            input.includes(key));
    });
    /*
     * Не разрешаем слишком общие запросы.
     *
     * Например:
     * "samsung"
     * "iphone"
     * "galaxy"
     *
     * не должны случайно выбирать первую модель.
     */
    const genericQueries = [
        "samsung",
        "galaxy",
        "iphone",
        "apple",
        "xiaomi",
        "redmi",
        "poco",
        "realme",
        "infinix",
        "tecno",
        "oneplus",
        "oppo",
        "honor",
        "google",
        "pixel",
        "vivo",
        "iqoo",
        "motorola",
        "moto",
        "nothing",
        "asus",
        "sony",
        "huawei",
        "nokia",
    ];
    if (genericQueries.includes(input)) {
        return getEmptySettings(deviceName);
    }
    /*
     * Если найден только один вариант —
     * возвращаем его.
     */
    if (matchingEntries.length === 1) {
        return matchingEntries[0][1];
    }
    /*
     * Если есть несколько вариантов,
     * пытаемся найти наиболее точный.
     */
    if (matchingEntries.length > 1) {
        const exactStart = matchingEntries.find(([key]) => key.startsWith(input) ||
            input.startsWith(key));
        if (exactStart) {
            return exactStart[1];
        }
    }
    /*
     * 3. Неизвестная модель.
     *
     * Никакой случайной генерации.
     * Все значения = 0.
     */
    return getEmptySettings(deviceName);
}
/*
 * =========================================================
 * ВСЕ УСТРОЙСТВА
 * =========================================================
 *
 * Для поиска показываем только основные модели,
 * а не aliases.
 */
const phones = models.map((model) => createPhone(model.name, model.brand, getProfile(model.name, model.profile)));
/*
 * =========================================================
 * ПОИСК
 * =========================================================
 */
function searchPhones(query) {
    const q = normalize(query);
    if (!q) {
        return [];
    }
    return phones
        .filter((phone) => {
        const name = normalize(phone.name);
        const brand = normalize(phone.brand);
        return (name.includes(q) ||
            brand.includes(q));
    })
        .slice(0, 8);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>'"]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'

}

/* ========================================================
 * FIRESET REACTION / AGILITY TEST
 * ======================================================== */
const reactionGame = {
  mode: 'reaction',
  running: false,
  round: 0,
  totalRounds: 5,
  hits: 0,
  times: [],
  startAt: 0,
  timer: null,
  dragStart: null,
  bestReaction: Number(localStorage.getItem('fireset-best-reaction') || 0),
  bestDrag: Number(localStorage.getItem('fireset-best-drag') || 0),
};

function reactionRandom(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function reactionStats() {
  const times = reactionGame.times.slice();
  if (!times.length) return { avg: 0, best: 0, consistency: 0 };
  const avg = times.reduce((a,b) => a+b, 0) / times.length;
  const best = Math.min(...times);
  const variance = times.reduce((s,t) => s + Math.pow(t - avg, 2), 0) / times.length;
  const sd = Math.sqrt(variance);
  const consistency = Math.max(0, Math.min(100, Math.round(100 - sd / 2.2)));
  return { avg: Math.round(avg), best, consistency };
}

function reactionRank(avg) {
  if (avg <= 190) return 'ЛЕГЕНДА';
  if (avg <= 240) return 'ЭЛИТА';
  if (avg <= 300) return 'МАСТЕР';
  if (avg <= 380) return 'ПРО';
  return 'НОВИЧОК';
}

function dragRank(score) {
  if (score >= 92) return 'ЛЕГЕНДА';
  if (score >= 82) return 'ЭЛИТА';
  if (score >= 70) return 'МАСТЕР';
  if (score >= 55) return 'ПРО';
  return 'НОВИЧОК';
}

function reactionFormatMs(value) {
  return value ? `${Math.round(value)} ms` : '—';
}

function setReactionStatus(text) {
  const el = document.querySelector('#reactionStatus');
  if (el) el.textContent = text;
}

function clearReactionTimer() {
  if (reactionGame.timer) {
    clearTimeout(reactionGame.timer);
    reactionGame.timer = null;
  }
}

function positionReactionTarget() {
  const arena = document.querySelector('#reactionArena');
  const target = document.querySelector('#reactionTarget');
  const zone = document.querySelector('#dragZone');
  if (!arena || !target) return;
  const rect = arena.getBoundingClientRect();
  const marginX = 36;
  const marginY = 42;
  const x = reactionRandom(marginX, Math.max(marginX, Math.floor(rect.width - marginX)));
  const y = reactionRandom(marginY, Math.max(marginY + 10, Math.floor(rect.height - 36)));
  target.style.left = `${x}px`;
  target.style.top = `${y}px`;
  target.style.display = 'block';
  if (zone) {
    zone.style.left = `${rect.width / 2}px`;
    zone.style.top = `${Math.max(74, rect.height - 62)}px`;
  }
}

function renderReactionMetrics() {
  const avgEl = document.querySelector('#reactionAvg');
  const bestEl = document.querySelector('#reactionBest');
  const hitsEl = document.querySelector('#reactionHits');
  if (!avgEl || !bestEl || !hitsEl) return;
  const stats = reactionStats();
  avgEl.textContent = reactionGame.mode === 'reaction' ? reactionFormatMs(stats.avg) : `${stats.consistency}%`;
  bestEl.textContent = reactionGame.mode === 'reaction' ? reactionFormatMs(stats.best) : `${Math.round(reactionGame.times[0] || 0)} ms`;
  hitsEl.textContent = `${reactionGame.hits}/${reactionGame.totalRounds}`;
}

function showReactionResult() {
  const result = document.querySelector('#reactionResult');
  const rank = document.querySelector('#reactionRank');
  const copy = document.querySelector('#reactionResultCopy');
  const foot = document.querySelector('#reactionFoot');
  if (!result || !rank || !copy || !foot) return;

  if (reactionGame.mode === 'reaction') {
    const stats = reactionStats();
    rank.textContent = reactionRank(stats.avg);
    copy.innerHTML = `Средняя реакция <b>${stats.avg} ms</b><br>Лучший раунд <b>${stats.best} ms</b>`;
    foot.textContent = 'Результат развлекательного теста: задержка зависит от экрана, мыши/тачскрина, браузера и устройства.';
    if (!reactionGame.bestReaction || stats.avg < reactionGame.bestReaction) {
      reactionGame.bestReaction = stats.avg;
      localStorage.setItem('fireset-best-reaction', String(stats.avg));
    }
  } else {
    const scores = reactionGame.times.slice();
    const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : 0;
    rank.textContent = dragRank(avg);
    const best = Math.max(...scores, 0);
    copy.innerHTML = `Средний drag-score <b>${avg}/100</b><br>Лучший раунд <b>${best}/100</b>`;
    foot.textContent = 'Тест оценивает точность и скорость перетаскивания как игровой ориентир, а не профессиональный aim-benchmark.';
    if (!reactionGame.bestDrag || avg > reactionGame.bestDrag) {
      reactionGame.bestDrag = avg;
      localStorage.setItem('fireset-best-drag', String(avg));
    }
  }
  result.style.display = 'block';
}

function updateReactionRecord() {
  const el = document.querySelector('#reactionRecordValue');
  if (!el) return;
  if (reactionGame.mode === 'reaction') {
    el.textContent = reactionGame.bestReaction ? `${reactionGame.bestReaction} ms` : '—';
  } else {
    el.textContent = reactionGame.bestDrag ? `${reactionGame.bestDrag}/100` : '—';
  }
}

function prepareReactionRound() {
  if (!reactionGame.running) return;
  clearReactionTimer();
  const target = document.querySelector('#reactionTarget');
  const zone = document.querySelector('#dragZone');
  if (!target) return;
  target.style.display = 'none';
  target.classList.remove('dragging');
  if (zone) zone.style.display = reactionGame.mode === 'drag' ? 'block' : 'none';
  setReactionStatus('ЖДИ...');
  const delay = reactionRandom(550, 1250);
  reactionGame.timer = setTimeout(() => {
    if (!reactionGame.running) return;
    positionReactionTarget();
    if (zone) zone.style.display = reactionGame.mode === 'drag' ? 'block' : 'none';
    reactionGame.startAt = performance.now();
    setReactionStatus(reactionGame.mode === 'reaction' ? 'НАЖМИ' : 'ПОТЯНИ В ЗОНУ');
  }, delay);
}

function finishReactionTest() {
  reactionGame.running = false;
  clearReactionTimer();
  const target = document.querySelector('#reactionTarget');
  const zone = document.querySelector('#dragZone');
  const start = document.querySelector('#reactionStart');
  if (target) target.style.display = 'none';
  if (zone) zone.style.display = 'none';
  const hint = document.querySelector('#reactionHint');
  if (hint) hint.style.display = 'flex';
  if (start) {
    start.disabled = false;
    start.textContent = 'ПОВТОРИТЬ ТЕСТ';
  }
  setReactionStatus('ГОТОВО');
  renderReactionMetrics();
  showReactionResult();
  updateReactionRecord();
}

function startReactionTest(mode = reactionGame.mode) {
  reactionGame.mode = mode;
  reactionGame.running = true;
  reactionGame.round = 1;
  reactionGame.hits = 0;
  reactionGame.times = [];
  reactionGame.startAt = 0;
  reactionGame.dragStart = null;
  clearReactionTimer();

  const start = document.querySelector('#reactionStart');
  const result = document.querySelector('#reactionResult');
  const target = document.querySelector('#reactionTarget');
  if (start) { start.disabled = true; start.textContent = 'ТЕСТ ИДЁТ…'; }
  if (result) result.style.display = 'none';
  const hint = document.querySelector('#reactionHint');
  if (hint) hint.style.display = 'none';
  if (target) target.style.display = 'none';
  setReactionStatus('РАУНД 1 / 5');
  renderReactionMetrics();
  prepareReactionRound();
}

function bindReactionGame() {
  const root = document.querySelector('#reactionCard');
  if (!root) return;
  const start = document.querySelector('#reactionStart');
  const target = document.querySelector('#reactionTarget');
  const arena = document.querySelector('#reactionArena');
  const modes = root.querySelectorAll('.reaction-mode');
  if (!start || !target || !arena || root.dataset.bound === '1') return;
  root.dataset.bound = '1';

  modes.forEach(btn => {
    btn.addEventListener('click', () => {
      if (reactionGame.running) return;
      reactionGame.mode = btn.dataset.mode;
      modes.forEach(x => x.classList.toggle('active', x === btn));
      const intro = document.querySelector('#reactionIntro');
      if (intro) intro.textContent = reactionGame.mode === 'reaction'
        ? 'Жди цель и нажми на неё как можно быстрее. 5 раундов.'
        : 'Зажми цель и перетащи её в светящуюся зону. 5 раундов.';
      const hint = document.querySelector('#reactionHint');
      if (hint) hint.innerHTML = reactionGame.mode === 'reaction' ? 'Нажми «Начать тест»<br>и жди появления цели.' : 'Нажми «Начать тест»<br>и перетащи цель в DROP.';
      updateReactionRecord();
    });
  });

  start.addEventListener('click', () => startReactionTest(reactionGame.mode));

  target.addEventListener('click', e => {
    if (!reactionGame.running || reactionGame.mode !== 'reaction' || !reactionGame.startAt) return;
    e.preventDefault();
    const elapsed = performance.now() - reactionGame.startAt;
    reactionGame.times.push(elapsed);
    reactionGame.hits += 1;
    reactionGame.startAt = 0;
    if (reactionGame.round >= reactionGame.totalRounds) {
      renderReactionMetrics();
      finishReactionTest();
      return;
    }
    reactionGame.round += 1;
    setReactionStatus(`РАУНД ${reactionGame.round} / ${reactionGame.totalRounds}`);
    renderReactionMetrics();
    prepareReactionRound();
  });

  target.addEventListener('pointerdown', e => {
    if (!reactionGame.running || reactionGame.mode !== 'drag' || !reactionGame.startAt) return;
    e.preventDefault();
    reactionGame.dragStart = { x: e.clientX, y: e.clientY };
    target.classList.add('dragging');
    target.setPointerCapture?.(e.pointerId);
  });

  target.addEventListener('pointermove', e => {
    if (!reactionGame.running || reactionGame.mode !== 'drag' || !reactionGame.dragStart) return;
    const rect = arena.getBoundingClientRect();
    const x = Math.max(30, Math.min(rect.width - 30, e.clientX - rect.left));
    const y = Math.max(30, Math.min(rect.height - 30, e.clientY - rect.top));
    target.style.left = `${x}px`;
    target.style.top = `${y}px`;
  });

  const finishDrag = e => {
    if (!reactionGame.running || reactionGame.mode !== 'drag' || !reactionGame.dragStart || !reactionGame.startAt) return;
    e.preventDefault();
    const rect = arena.getBoundingClientRect();
    const targetX = parseFloat(target.style.left || '0');
    const targetY = parseFloat(target.style.top || '0');
    const zoneX = rect.width / 2;
    const zoneY = Math.max(74, rect.height - 62);
    const distance = Math.hypot(targetX - zoneX, targetY - zoneY);
    const elapsed = performance.now() - reactionGame.startAt;
    const score = Math.max(0, Math.min(100, Math.round(100 - distance * 1.15 - Math.max(0, elapsed - 700) / 12)));
    if (distance <= 52) reactionGame.hits += 1;
    reactionGame.times.push(score);
    reactionGame.startAt = 0;
    reactionGame.dragStart = null;
    target.classList.remove('dragging');
    if (reactionGame.round >= reactionGame.totalRounds) {
      renderReactionMetrics();
      finishReactionTest();
      return;
    }
    reactionGame.round += 1;
    setReactionStatus(`РАУНД ${reactionGame.round} / ${reactionGame.totalRounds}`);
    renderReactionMetrics();
    prepareReactionRound();
  };

  target.addEventListener('pointerup', finishDrag);
  target.addEventListener('pointercancel', finishDrag);
}

<script>
(function(){
  var nav=document.querySelector('.fireset-site-nav');
  if(!nav) return;
  var buttons=nav.querySelectorAll('[data-fs-lang]');
  function getSelect(){return document.querySelector('.goog-te-combo');}
  function setLanguage(lang){
    try { localStorage.setItem('fireset-language',lang); } catch(e) {}
    buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-fs-lang')===lang));});
    if(lang==='ru'){
      // Reload the original Russian source after any client-side translation.
      if(document.documentElement.lang!=='ru' || document.querySelector('html.translated-ltr, html.translated-rtl')){
        window.location.reload();
      }
      return;
    }
    var select=getSelect();
    if(select){select.value=lang;select.dispatchEvent(new Event('change'));return;}
    window.__firesetWantedLanguage=lang;
    if(!window.google||!google.translate){
      var el=document.createElement('div');el.id='google_translate_element';document.body.appendChild(el);
      if(!document.getElementById('fs-google-translate-script')){
        var script=document.createElement('script');script.id='fs-google-translate-script';
        script.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        document.head.appendChild(script);
      }
    }
  }
  window.googleTranslateElementInit=function(){
    try {
      new google.translate.TranslateElement({pageLanguage:'ru',includedLanguages:'ru,en',autoDisplay:false},'google_translate_element');
      var tries=0;
      var timer=setInterval(function(){
        var s=getSelect();tries++;
        if(s){clearInterval(timer);var wanted=window.__firesetWantedLanguage||'ru';s.value=wanted;s.dispatchEvent(new Event('change'));}
        if(tries>30)clearInterval(timer);
      },250);
    } catch(e) {}
  };
  buttons.forEach(function(b){b.addEventListener('click',function(){setLanguage(b.getAttribute('data-fs-lang'));});});
  var saved='ru';try{saved=localStorage.getItem('fireset-language')||'ru';}catch(e){}
  buttons.forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-fs-lang')===saved));});
  if(saved==='en'){setLanguage('en');}
})();
</script>
